name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      ASTRBOT_ROOT: /tmp/checkin-calendar-astrbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q main.py store.py presentation.py rendering.py scripts tests
      - name: Build installation archive
        run: python scripts/package.py --output dist/astrbot_plugin_checkin_calendar.zip
      - name: Validate installation archive
        run: python scripts/verify_package.py dist/astrbot_plugin_checkin_calendar.zip
      - name: Install preview browser
        if: matrix.python == '3.12'
        run: python -m playwright install --with-deps chromium
      - name: Render and check production template
        if: matrix.python == '3.12'
        run: python scripts/preview.py --output previews
      - name: Upload preview evidence
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: calendar-previews
          path: previews/
      - name: Upload installation archive
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: checkin-calendar-plugin
          path: dist/
